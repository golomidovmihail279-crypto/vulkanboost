[mod]
id = "vulkanboost"
version = "0.1.0"
priority = 50

[compatibility]
horizon_revision = "29b3374b5df2dca2001f0b1f5209307111fdd177"

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "vulkanboost"
source = "runtime.rs"

[[injection]]
id = "list"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

[[injection]]
id = "settings"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_settings"
helper = "settings.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "buttons", ty = "&mut Vec<String>", value = "&mut *buttons" },
]

[[injection]]
id = "click"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_settings_click"
helper = "click.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "button", ty = "usize", value = "button" },
]

[[injection]]
id = "background_framerate_limit"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_framerate_limit"
helper = "framerate.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "self" },
  { name = "focused", ty = "bool", value = "focused" },
  { name = "minimized", ty = "bool", value = "minimized" },
  { name = "in_world", ty = "bool", value = "in_world" },
  { name = "limit", ty = "&mut i32", value = "limit" },
]
