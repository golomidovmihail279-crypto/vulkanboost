name: Mark VulkanBoost alpha as latest release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mark-alpha-latest.yml"

permissions:
  contents: write

jobs:
  mark-latest:
    runs-on: ubuntu-latest
    steps:
      - name: Mark alpha as the latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit v0.1.0-alpha.1 --latest
