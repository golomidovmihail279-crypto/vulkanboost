name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Build remapped mod JAR
        run: gradle --no-daemon clean build

      - name: Validate one-JAR bundle and nested metadata
        shell: python
        run: |
          import glob
          import io
          import json
          import zipfile
          from pathlib import Path

          EXPECTED_TOP_LEVEL_COUNT = 19
          candidates = [
              path for path in glob.glob("build/libs/vulkanboost-*.jar")
              if not path.endswith("-dev.jar") and not path.endswith("-sources.jar")
          ]
          if len(candidates) != 1:
              raise SystemExit(f"Expected exactly one installable JAR, found: {candidates}")

          def inspect_nested(jar_bytes, label):
              with zipfile.ZipFile(io.BytesIO(jar_bytes)) as archive:
                  metadata = json.loads(archive.read("fabric.mod.json"))
                  for item in metadata.get("jars", []):
                      child_name = item["file"]
                      inspect_nested(archive.read(child_name), f"{label}!/{child_name}")
                  return metadata

          jar_path = candidates[0]
          with zipfile.ZipFile(jar_path) as archive:
              metadata = json.loads(archive.read("fabric.mod.json"))
              nested = metadata.get("jars", [])
              if len(nested) != EXPECTED_TOP_LEVEL_COUNT:
                  raise SystemExit(
                      f"Expected {EXPECTED_TOP_LEVEL_COUNT} top-level mod/library JARs, found {len(nested)}"
                  )

              found_ids = []
              for item in nested:
                  child_meta = inspect_nested(archive.read(item["file"]), f"{jar_path}!/{item['file']}")
                  mod_id = child_meta.get("id")
                  if not mod_id:
                      raise SystemExit(f"Missing mod id in {item['file']}")
                  found_ids.append(mod_id)
                  print(f"Top-level component OK: {mod_id} {child_meta.get('version')}")

              if len(set(found_ids)) != len(found_ids):
                  raise SystemExit(f"Duplicate top-level mod IDs found: {found_ids}")

              # The official BetterHurtCam JAR must be the only hurt-camera implementation.
              if metadata.get("mixins"):
                  raise SystemExit("VulkanBoost must not register a competing NoHurtCam mixin.")
              required_upstream_ids = {"betterhurtcam", "ukulib"}
              if not required_upstream_ids.issubset(set(found_ids)):
                  missing = sorted(required_upstream_ids - set(found_ids))
                  raise SystemExit(f"Official BetterHurtCam and Ukulib are missing: {missing}")
              if Path("src/main/java/dev/vulkanboost/mixin/NoHurtCamMixin.java").exists():
                  raise SystemExit("The old custom NoHurtCam mixin must be removed.")
              if Path("src/main/resources/vulkanboost.mixins.json").exists():
                  raise SystemExit("The old custom VulkanBoost mixin config must be removed.")

              required_project_files = [
                  "dev/vulkanboost/NoHurtCamConfig.class",
                  "dev/vulkanboost/NoHurtCamScreen.class",
                  "dev/vulkanboost/NoHurtCamSetupScreen.class",
                  "dev/vulkanboost/NoHurtCamScreen$StrengthSlider.class",
                  "dev/vulkanboost/NoHurtCamSetupScreen$StrengthSlider.class",
                  "dev/vulkanboost/VulkanBoostClient.class",
                  "assets/vulkanboost/lang/en_us.json",
                  "assets/vulkanboost/lang/ru_ru.json",
                  "assets/betterhurtcam/lang/ru_ru.json",
              ]
              for required_file in required_project_files:
                  if required_file not in archive.namelist():
                      raise SystemExit(f"Required settings/translation file is missing: {required_file}")

              if archive.read("fabric.mod.json") is None:
                  raise SystemExit("Root Fabric metadata missing")

              # The 1.21.11 client crashes if these screens invoke the blur background path twice.
              setup_source = Path("src/main/java/dev/vulkanboost/NoHurtCamSetupScreen.java").read_text(encoding="utf-8")
              screen_source = Path("src/main/java/dev/vulkanboost/NoHurtCamScreen.java").read_text(encoding="utf-8")
              for screen_name, source in [("setup", setup_source), ("settings", screen_source)]:
                  if "this.renderBackground(" in source:
                      raise SystemExit(f"NoHurtCam {screen_name} screen still calls the blur background path.")
                  if "graphics.fill(0, 0, this.width, this.height, 0xC0101010);" not in source:
                      raise SystemExit(f"NoHurtCam {screen_name} screen is missing the non-blurred background.")

              client_source = Path("src/main/java/dev/vulkanboost/VulkanBoostClient.java").read_text(encoding="utf-8")
              config_source = Path("src/main/java/dev/vulkanboost/NoHurtCamConfig.java").read_text(encoding="utf-8")
              required_config_tokens = [
                  "BetterHurtCam.getManager()",
                  "getMultiplier()",
                  "setMultiplier(",
                  "setEnabled(",
                  "saveConfig()",
                  "betterHurtCamMigrationComplete",
                  "betterhurtcam.toml",
              ]
              for token in required_config_tokens:
                  if token not in config_source:
                      raise SystemExit(f"VulkanBoost settings are not bridged to BetterHurtCam: {token}")

              required_client_tokens = [
                  '"key.vulkanboost.open_no_hurt_cam"',
                  "KeyBindingHelper.registerKeyBinding",
                  "public static boolean hasKeyConflict(",
                  "public static void setOpenSettingsKeyInMemory(",
              ]
              for token in required_client_tokens:
                  if token not in client_source:
                      raise SystemExit(f"Missing expected settings keybinding API in VulkanBoostClient: {token}")

              required_setup_tokens = [
                  "assignSettingsKey",
                  "getOpenSettingsKeyName",
                  "isOpenSettingsKeyAssigned",
                  "setOpenSettingsKeyInMemory",
                  "hasKeyConflict",
              ]
              for token in required_setup_tokens:
                  if token not in setup_source:
                      raise SystemExit(f"Setup wizard is missing expected keybinding behavior: {token}")
              if "assignToggleKey" in setup_source:
                  raise SystemExit("Setup wizard must configure the settings-opening key, not a duplicate toggle.")

              translation_keys = []
              for locale in ("en_us.json", "ru_ru.json"):
                  locale_path = f"src/main/resources/assets/vulkanboost/lang/{locale}"
                  locale_data = json.loads(Path(locale_path).read_text(encoding="utf-8"))
                  required_locale_keys = {
                      "key.vulkanboost.open_no_hurt_cam",
                      "screen.vulkanboost.setup.description",
                      "screen.vulkanboost.setup.bind",
                      "screen.vulkanboost.setup.key_conflict",
                  }
                  missing = sorted(required_locale_keys - set(locale_data))
                  if missing:
                      raise SystemExit(f"{locale} is missing required translation keys: {missing}")
                  translation_keys.append(set(locale_data))
              if translation_keys[0] != translation_keys[1]:
                  raise SystemExit("English and Russian translation keys do not match.")

              # Validate that the official BetterHurtCam UI is localized too.
              bhc_locale = json.loads(
                  Path("src/main/resources/assets/betterhurtcam/lang/ru_ru.json").read_text(encoding="utf-8")
              )
              required_bhc_ru_keys = {
                  "betterhurtcam.option.enabled",
                  "betterhurtcam.option.strength",
                  "betterhurtcam.option.heartBlink",
                  "betterhurtcam.option.type",
                  "betterhurtcam.option.type.tooltip",
                  "key.betterhurtcam.toggle",
                  "key.betterhurtcam.plus",
                  "key.betterhurtcam.minus",
                  "betterhurtcam.type.old",
                  "betterhurtcam.type.yawBased",
              }
              missing_bhc_ru = sorted(required_bhc_ru_keys - set(bhc_locale))
              if missing_bhc_ru:
                  raise SystemExit(f"Russian translations for BetterHurtCam are missing: {missing_bhc_ru}")

              # Keep the meaning of the slider's reduction percentage explicit.
              for locale, phrase in [
                  ("en_us.json", "hurt-camera tilt"),
                  ("ru_ru.json", "наклона камеры"),
              ]:
                  locale_path = f"src/main/resources/assets/vulkanboost/lang/{locale}"
                  locale_data = json.loads(Path(locale_path).read_text(encoding="utf-8"))
                  description = locale_data["screen.vulkanboost.no_hurt_cam.description"].lower()
                  slider_label = locale_data["option.vulkanboost.hurt_cam_reduction"].lower()
                  setup_hint = locale_data["screen.vulkanboost.setup.strength_hint"].lower()
                  if phrase not in slider_label or "50%" not in description or "100%" not in description:
                      raise SystemExit(f"{locale} must clearly describe the hurt-camera reduction percentage.")
                  if "50%" not in setup_hint or "100%" not in setup_hint:
                      raise SystemExit(f"{locale} setup hint must explain what 50% and 100% mean.")

              forbidden_ids = {"osmium", "dynamicrenderdistance", "architectury"}
              present_forbidden = sorted(forbidden_ids.intersection(found_ids))
              if present_forbidden:
                  raise SystemExit(f"These components must stay out of VulkanBoost 0.4.9: {present_forbidden}")

          print(f"Validated 19 nested components including official BetterHurtCam and Ukulib: {jar_path}")
      - name: Upload installable JAR
        uses: actions/upload-artifact@v4
        with:
          name: vulkanboost-minecraft-1.21.11
          path: |
            build/libs/vulkanboost-*.jar
            !build/libs/*-dev.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 14
