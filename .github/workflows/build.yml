name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Build remapped mod JAR
        run: gradle --no-daemon clean build

      - name: Validate one-JAR bundle and untouched upstream BetterHurtCam
        shell: python
        run: |
          import glob
          import io
          import json
          import zipfile
          from pathlib import Path

          EXPECTED_TOP_LEVEL_COUNT = 20
          candidates = [
              path for path in glob.glob("build/libs/vulkanboost-*.jar")
              if not path.endswith("-dev.jar") and not path.endswith("-sources.jar")
          ]
          if len(candidates) != 1:
              raise SystemExit(f"Expected exactly one installable JAR, found: {candidates}")

          def inspect_nested(jar_bytes, label):
              with zipfile.ZipFile(io.BytesIO(jar_bytes)) as archive:
                  metadata = json.loads(archive.read("fabric.mod.json"))
                  for item in metadata.get("jars", []):
                      child_name = item["file"]
                      inspect_nested(archive.read(child_name), f"{label}!/{child_name}")
                  return metadata

          jar_path = candidates[0]
          with zipfile.ZipFile(jar_path) as archive:
              metadata = json.loads(archive.read("fabric.mod.json"))
              nested = metadata.get("jars", [])
              if len(nested) != EXPECTED_TOP_LEVEL_COUNT:
                  raise SystemExit(
                      f"Expected {EXPECTED_TOP_LEVEL_COUNT} top-level mod/library JARs, found {len(nested)}"
                  )

              component_versions = {}
              for item in nested:
                  child_meta = inspect_nested(archive.read(item["file"]), f"{jar_path}!/{item['file']}")
                  mod_id = child_meta.get("id")
                  if not mod_id:
                      raise SystemExit(f"Missing mod id in {item['file']}")
                  if mod_id in component_versions:
                      raise SystemExit(f"Duplicate top-level mod id: {mod_id}")
                  component_versions[mod_id] = child_meta.get("version")
                  print(f"Top-level component OK: {mod_id} {child_meta.get('version')}")

              required_versions = {
                  "betterhurtcam": "1.12.0+mc1.21.11",
                  "ukulib": "1.10.2+1.21.11",
              }
              for mod_id, expected_version in required_versions.items():
                  actual_version = component_versions.get(mod_id)
                  if actual_version != expected_version:
                      raise SystemExit(
                          f"Expected upstream {mod_id} {expected_version}, found {actual_version}"
                      )

              render_scale_version = component_versions.get("renderscale")
              if not render_scale_version or not str(render_scale_version).startswith("1.4.0-alpha.1"):
                  raise SystemExit(
                      f"Expected RenderScale 1.4.0-alpha.1 for Minecraft 1.21.11, found {render_scale_version}"
                  )

              root_depends = metadata.get("depends", {})
              for required_dependency in ("betterhurtcam", "ukulib", "renderscale"):
                  if required_dependency not in root_depends:
                      raise SystemExit(f"Root metadata must declare {required_dependency}.")
              if metadata.get("entrypoints"):
                  raise SystemExit("The root bundle must not register custom runtime entrypoints.")
              if metadata.get("mixins"):
                  raise SystemExit("The root bundle must not register custom mixins.")
              if any(path.startswith("dev/vulkanboost/") for path in archive.namelist()):
                  raise SystemExit("The root JAR must not contain custom compiled runtime classes.")
              forbidden_asset_prefixes = ("assets/vulkanboost/", "assets/betterhurtcam/")
              for entry in archive.namelist():
                  if entry.startswith(forbidden_asset_prefixes):
                      raise SystemExit(f"The root JAR must not override bundled mod resources: {entry}")

              if "fabric.mod.json" not in archive.namelist():
                  raise SystemExit("Root Fabric metadata is missing.")

              source_root = Path("src/main/java")
              if source_root.exists():
                  java_sources = list(source_root.rglob("*.java"))
                  if java_sources:
                      raise SystemExit(
                          f"The bundle must contain no custom Java runtime code: {[str(p) for p in java_sources]}"
                      )

              asset_root = Path("src/main/resources/assets")
              if asset_root.exists():
                  root_assets = [p for p in asset_root.rglob("*") if p.is_file()]
                  if root_assets:
                      raise SystemExit(
                          f"The bundle must not patch nested mods' resources: {[str(p) for p in root_assets]}"
                      )

              forbidden_ids = {"osmium", "dynamicrenderdistance", "architectury"}
              present_forbidden = sorted(forbidden_ids.intersection(component_versions))
              if present_forbidden:
                  raise SystemExit(f"These components must stay out of VulkanBoost 0.5: {present_forbidden}")

          print(
              "Validated 19 nested components; BetterHurtCam and Ukulib match the pinned upstream versions, "
              "with no custom runtime classes or asset overrides."
          )

      - name: Upload installable JAR
        uses: actions/upload-artifact@v4
        with:
          name: vulkanboost-minecraft-1.21.11
          path: |
            build/libs/vulkanboost-*.jar
            !build/libs/*-dev.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 14
