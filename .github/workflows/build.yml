name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Build remapped mod JAR
        run: gradle --no-daemon clean build

      - name: Validate one-JAR bundle and nested metadata
        shell: python
        run: |
          import glob
          import io
          import json
          import zipfile

          EXPECTED_TOP_LEVEL_COUNT = 17
          candidates = [
              path for path in glob.glob("build/libs/vulkanboost-*.jar")
              if not path.endswith("-dev.jar") and not path.endswith("-sources.jar")
          ]
          if len(candidates) != 1:
              raise SystemExit(f"Expected exactly one installable JAR, found: {candidates}")

          def inspect_nested(jar_bytes, label):
              with zipfile.ZipFile(io.BytesIO(jar_bytes)) as archive:
                  metadata = json.loads(archive.read("fabric.mod.json"))
                  for item in metadata.get("jars", []):
                      child_name = item["file"]
                      inspect_nested(archive.read(child_name), f"{label}!/{child_name}")
                  return metadata

          jar_path = candidates[0]
          with zipfile.ZipFile(jar_path) as archive:
              metadata = json.loads(archive.read("fabric.mod.json"))
              nested = metadata.get("jars", [])
              if len(nested) != EXPECTED_TOP_LEVEL_COUNT:
                  raise SystemExit(
                      f"Expected {EXPECTED_TOP_LEVEL_COUNT} top-level mod/library JARs, found {len(nested)}"
                  )

              found_ids = []
              for item in nested:
                  child_meta = inspect_nested(archive.read(item["file"]), f"{jar_path}!/{item['file']}")
                  mod_id = child_meta.get("id")
                  if not mod_id:
                      raise SystemExit(f"Missing mod id in {item['file']}")
                  found_ids.append(mod_id)
                  print(f"Top-level component OK: {mod_id} {child_meta.get('version')}")

              if len(set(found_ids)) != len(found_ids):
                  raise SystemExit(f"Duplicate top-level mod IDs found: {found_ids}")
              # Validate VulkanBoost's own client mixin, separately from nested third-party mods.
              root_mixin_configs = metadata.get("mixins", [])
              if "vulkanboost.mixins.json" not in root_mixin_configs:
                  raise SystemExit("VulkanBoost's NoHurtCam mixin config is missing from fabric.mod.json")
              mixin_config = json.loads(archive.read("vulkanboost.mixins.json"))
              if "NoHurtCamMixin" not in mixin_config.get("client", []):
                  raise SystemExit("NoHurtCamMixin is missing from the client mixin config")
              if "dev/vulkanboost/mixin/NoHurtCamMixin.class" not in archive.namelist():
                  raise SystemExit("NoHurtCamMixin class is missing from the built JAR")

              forbidden_ids = {"osmium", "dynamicrenderdistance", "architectury"}
              present_forbidden = sorted(forbidden_ids.intersection(found_ids))
              if present_forbidden:
                  raise SystemExit(f"These components must stay out of VulkanBoost 0.4.3: {present_forbidden}")

          print(f"Validated 17 nested components and built-in NoHurtCam: {jar_path}")
      - name: Upload installable JAR
        uses: actions/upload-artifact@v4
        with:
          name: vulkanboost-minecraft-1.21.11
          path: |
            build/libs/vulkanboost-*.jar
            !build/libs/*-dev.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 14
