name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Build remapped mod JAR
        run: gradle --no-daemon clean build

      - name: Validate bundle and absence of legacy rendering code
        run: |
          set -euo pipefail
          mapfile -t candidates < <(find build/libs -maxdepth 1 -type f -name 'vulkanboost-*.jar' ! -name '*-dev.jar' ! -name '*-sources.jar' | sort)
          if [[ "${#candidates[@]}" -ne 1 ]]; then
            echo "Expected exactly one installable JAR, found: ${candidates[*]:-none}"
            exit 1
          fi
          python3 scripts/check_bundle.py "${candidates[0]}"

      - name: Run checker unit tests
        run: python3 -m unittest discover -s scripts -p "test_*.py"

      - name: Upload installable JAR
        uses: actions/upload-artifact@v4
        with:
          name: vulkanboost-minecraft-1.21.11
          path: |
            build/libs/vulkanboost-*.jar
            !build/libs/*-dev.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 14

  publish-v0-5:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[update-v0.5]')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download validated installable JAR
        uses: actions/download-artifact@v4
        with:
          name: vulkanboost-minecraft-1.21.11
          path: artifact

      - name: Replace the existing v0.5 release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp artifact/vulkanboost-0.5.jar VulkanBoost-0.5-for-1.21.11.jar
          sha256sum VulkanBoost-0.5-for-1.21.11.jar > VulkanBoost-0.5-for-1.21.11.jar.sha256
          gh release upload v0.5 VulkanBoost-0.5-for-1.21.11.jar VulkanBoost-0.5-for-1.21.11.jar.sha256 --clobber --repo "$GITHUB_REPOSITORY"
