name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Build remapped mod JAR
        run: gradle --no-daemon clean build

      - name: Validate single-JAR bundle and nested metadata
        shell: python
        run: |
          import glob
          import io
          import json
          import zipfile

          EXPECTED_TOP_LEVEL = {
              "fabric-api", "vulkanmod", "lithium", "ferritecore",
              "alternate_current", "badoptimizations", "modernfix",
              "scalablelux", "zfastnoise", "krypton"
          }

          candidates = [
              path for path in glob.glob("build/libs/vulkanboost-*.jar")
              if not path.endswith("-dev.jar") and not path.endswith("-sources.jar")
          ]
          if len(candidates) != 1:
              raise SystemExit(f"Expected exactly one installable JAR, found: {candidates}")

          def inspect_nested(jar_bytes, label):
              with zipfile.ZipFile(io.BytesIO(jar_bytes)) as archive:
                  metadata = json.loads(archive.read("fabric.mod.json"))
                  for item in metadata.get("jars", []):
                      name = item["file"]
                      child_bytes = archive.read(name)
                      child_meta = inspect_nested(child_bytes, f"{label}!/{name}")
                      print(f"Nested mod OK: {child_meta.get('id')} {child_meta.get('version')}")
                  return metadata

          jar_path = candidates[0]
          with zipfile.ZipFile(jar_path) as archive:
              metadata = json.loads(archive.read("fabric.mod.json"))
              nested = metadata.get("jars", [])
              if len(nested) != 10:
                  raise SystemExit(f"Expected 10 top-level nested mod JARs, found {len(nested)}")

              found_ids = set()
              for item in nested:
                  name = item["file"]
                  child_meta = inspect_nested(archive.read(name), f"{jar_path}!/{name}")
                  found_ids.add(child_meta.get("id"))
                  print(f"Top-level component OK: {child_meta.get('id')} {child_meta.get('version')}")

              if found_ids != EXPECTED_TOP_LEVEL:
                  raise SystemExit(
                      f"Top-level component IDs differ. Missing: {EXPECTED_TOP_LEVEL - found_ids}; "
                      f"unexpected: {found_ids - EXPECTED_TOP_LEVEL}"
                  )

          print(f"Validated installable bundle: {jar_path}")
      - name: Upload installable JAR
        uses: actions/upload-artifact@v4
        with:
          name: vulkanboost-minecraft-1.21.11
          path: |
            build/libs/vulkanboost-*.jar
            !build/libs/*-dev.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 14
