name: Publish audited VulkanBoost 1.0

on:
  push:
    branches:
      - publish-audited-v1.0

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out audited main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 46ffd405d60946021f5dc65ce1fa227395d97b3e
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: "9.5.0"

      - name: Verify source version
        run: |
          set -euo pipefail
          test "$(sed -n 's/^mod_version=//p' gradle.properties)" = "1.0"

      - name: Build audited JAR
        run: gradle --no-daemon clean build

      - name: Validate bundle
        run: |
          set -euo pipefail
          mapfile -t candidates < <(find build/libs -maxdepth 1 -type f -name 'vulkanboost-*.jar' ! -name '*-sources.jar' | sort)
          if [[ "${#candidates[@]}" -ne 1 ]]; then
            echo "Expected exactly one installable JAR, found: ${candidates[*]:-none}"
            exit 1
          fi
          python3 scripts/check_bundle.py "${candidates[0]}"

      - name: Run Python regression tests
        run: python3 -m unittest discover -s scripts -p "test_*.py"

      - name: Run Java option-transaction tests
        run: |
          set -euo pipefail
          mkdir -p build/option-transaction-tests
          javac -encoding UTF-8 -d build/option-transaction-tests \
            src/main/java/dev/vulkanboost/autotune/ReversibleOptionChanges.java \
            scripts/java-tests/dev/vulkanboost/autotune/ReversibleOptionChangesSelfTest.java
          java -cp build/option-transaction-tests dev.vulkanboost.autotune.ReversibleOptionChangesSelfTest

      - name: Run Java UI layout regression tests
        run: |
          set -euo pipefail
          mkdir -p build/screen-layout-tests
          javac -encoding UTF-8 -d build/screen-layout-tests \
            src/main/java/dev/vulkanboost/client/ScreenLayout.java \
            scripts/java-tests/dev/vulkanboost/client/ScreenLayoutSelfTest.java
          java -cp build/screen-layout-tests dev.vulkanboost.client.ScreenLayoutSelfTest

      - name: Run Java memory-distance policy tests
        run: |
          set -euo pipefail
          mkdir -p build/memory-policy-tests
          javac -encoding UTF-8 -d build/memory-policy-tests \
            src/main/java/dev/vulkanboost/memory/MemoryDistancePolicy.java \
            scripts/java-tests/dev/vulkanboost/memory/MemoryDistancePolicySelfTest.java
          java -cp build/memory-policy-tests dev.vulkanboost.memory.MemoryDistancePolicySelfTest

      - name: Prepare release assets
        run: |
          set -euo pipefail
          cp build/libs/vulkanboost-1.0.jar build/libs/VulkanBoost-1.0-for-1.21.11.jar
          cd build/libs
          sha256sum VulkanBoost-1.0-for-1.21.11.jar > VulkanBoost-1.0-for-1.21.11.jar.sha256

      - name: Replace assets in existing v1.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload v1.0 \
            build/libs/VulkanBoost-1.0-for-1.21.11.jar \
            build/libs/VulkanBoost-1.0-for-1.21.11.jar.sha256 \
            --clobber

      - name: Point v1.0 tag to audited main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/v1.0" \
            -f sha=46ffd405d60946021f5dc65ce1fa227395d97b3e \
            -F force=true
