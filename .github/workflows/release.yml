name: Publish VulkanBoost release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: vulkanboost-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "9.5.0"

      - name: Resolve and verify release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" != "tag" || "$GITHUB_REF_NAME" != v* ]]; then
            echo "This workflow only publishes version tags beginning with v."
            exit 1
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          MOD_VERSION="$(sed -n 's/^mod_version=//p' gradle.properties)"
          if [[ -z "$VERSION" || "$VERSION" != "$MOD_VERSION" ]]; then
            echo "Release version '$VERSION' does not match mod_version '$MOD_VERSION'"
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,2}([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build remapped mod JAR
        run: gradle --no-daemon clean build

      - name: Validate bundle and source tree
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          JAR="build/libs/vulkanboost-$VERSION.jar"
          test -f "$JAR"
          python3 scripts/check_bundle.py "$JAR"

      - name: Run Python regression tests
        run: python3 -m unittest discover -s scripts -p "test_*.py"

      - name: Run Java option-transaction tests
        run: |
          set -euo pipefail
          mkdir -p build/option-transaction-tests
          javac -encoding UTF-8 -d build/option-transaction-tests \
            src/main/java/dev/vulkanboost/autotune/ReversibleOptionChanges.java \
            scripts/java-tests/dev/vulkanboost/autotune/ReversibleOptionChangesSelfTest.java
          java -cp build/option-transaction-tests dev.vulkanboost.autotune.ReversibleOptionChangesSelfTest

      - name: Run Java UI layout regression tests
        run: |
          set -euo pipefail
          mkdir -p build/screen-layout-tests
          javac -encoding UTF-8 -d build/screen-layout-tests \
            src/main/java/dev/vulkanboost/client/ScreenLayout.java \
            scripts/java-tests/dev/vulkanboost/client/ScreenLayoutSelfTest.java
          java -cp build/screen-layout-tests dev.vulkanboost.client.ScreenLayoutSelfTest

      - name: Run Java memory-distance policy tests
        run: |
          set -euo pipefail
          mkdir -p build/memory-policy-tests
          javac -encoding UTF-8 -d build/memory-policy-tests \
            src/main/java/dev/vulkanboost/memory/MemoryDistancePolicy.java \
            scripts/java-tests/dev/vulkanboost/memory/MemoryDistancePolicySelfTest.java
          java -cp build/memory-policy-tests dev.vulkanboost.memory.MemoryDistancePolicySelfTest

      - name: Prepare release asset and checksum
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_JAR="build/libs/vulkanboost-$VERSION.jar"
          RELEASE_JAR="build/libs/VulkanBoost-$VERSION-for-1.21.11.jar"
          cp "$SOURCE_JAR" "$RELEASE_JAR"
          sha256sum "$RELEASE_JAR" > "$RELEASE_JAR.sha256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          ASSET="build/libs/VulkanBoost-$VERSION-for-1.21.11.jar"
          CHECKSUM="$ASSET.sha256"
          TITLE="VulkanBoost-$VERSION-for-1.21.11"
          gh release create "$GITHUB_REF_NAME" "$ASSET" "$CHECKSUM" \
            --title "$TITLE" --notes-file CHANGELOG.md
