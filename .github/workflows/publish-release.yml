name: Publish VulkanBoost release

on:
  workflow_run:
    workflows: ["Build"]
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Ensure this is the latest main commit
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          latest_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          if [[ "$latest_sha" != "$BUILT_SHA" ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Skipping stale build $BUILT_SHA; main is now $latest_sha."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Build SHA matches the current main branch."
          fi

      - name: Check out release metadata
        if: steps.guard.outputs.publish == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download verified build artifact
        if: steps.guard.outputs.publish == 'true'
        uses: actions/download-artifact@v4
        with:
          name: vulkanboost-minecraft-1.21.11
          path: dist
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare release asset and checksum
        if: steps.guard.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          jars=(dist/vulkanboost-*.jar)
          if [[ "${#jars[@]}" -ne 1 ]]; then
            echo "Expected exactly one installable JAR in the downloaded artifact; found ${#jars[@]}."
            find dist -maxdepth 3 -type f -print
            exit 1
          fi
          cp "${jars[0]}" dist/VulkanBoost-0.1.0.jar
          cd dist
          sha256sum VulkanBoost-0.1.0.jar > VulkanBoost-0.1.0.jar.sha256

      - name: Remove superseded alpha release and tag
        if: steps.guard.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release delete v0.1.0-alpha.1 --yes || true
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/v0.1.0-alpha.1" || true

      - name: Publish latest GitHub Release
        if: steps.guard.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          name: VulkanBoost 0.1.0
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          body_path: .github/RELEASE_NOTES.md
          prerelease: false
          draft: false
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            dist/VulkanBoost-0.1.0.jar
            dist/VulkanBoost-0.1.0.jar.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
