name: Publish VulkanBoost release

on:
  workflow_run:
    workflows: ["Build"]
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
    runs-on: ubuntu-latest
    steps:
      - name: Ensure this is an explicit release request for the latest main commit
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILT_SHA: ${{ github.event.workflow_run.head_sha }}
          BUILT_MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
        run: |
          if [[ "$BUILT_MESSAGE" != *"[release-v0.6]"* ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "This is not the explicit VulkanBoost 0.6 release commit."
            exit 0
          fi
          latest_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          if [[ "$latest_sha" != "$BUILT_SHA" ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Skipping stale build $BUILT_SHA; main is now $latest_sha."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Release marker and current main SHA both match."
          fi

      - name: Check out release metadata
        if: steps.guard.outputs.publish == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download validated build artifact
        if: steps.guard.outputs.publish == 'true'
        uses: actions/download-artifact@v4
        with:
          name: vulkanboost-minecraft-1.21.11
          path: dist
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare release asset and checksum
        if: steps.guard.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          jars=(dist/vulkanboost-0.6.jar)
          if [[ "${#jars[@]}" -ne 1 ]]; then
            echo "Expected exactly one validated build artifact: dist/vulkanboost-0.6.jar"
            find dist -maxdepth 3 -type f -print
            exit 1
          fi
          output="VulkanBoost-0.6-for-1.21.11.jar"
          cp "${jars[0]}" "dist/${output}"
          cd dist
          sha256sum "${output}" > "${output}.sha256"

      - name: Publish VulkanBoost 0.6 for Minecraft 1.21.11
        if: steps.guard.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.6
          name: VulkanBoost-0.6-for-1.21.11
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          body_path: .github/RELEASE_NOTES.md
          prerelease: false
          draft: false
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            dist/VulkanBoost-0.6-for-1.21.11.jar
            dist/VulkanBoost-0.6-for-1.21.11.jar.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
